<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
</head>
<style>
  html {
    height: calc(100% - 16px);
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  h3 {
    margin-top: 0px;
    margin-bottom: 16px;
  }
  p {
    margin-top: 8px;
    margin-bottom: 8px;
  }
  #event-log {
    margin-top: 8px;
    min-height: 300px;
    height: 100%;
    overflow-y: scroll;
    overscroll-behavior: contain;
  }
</style>
<body>
  <div>
    <h3>Batch Progress:</h3>
    <div id="batch-progress">Batches Complete: ? of ?</div>
    <label id="progress-bar-label" for="progress-bar">Percent Complete: 0%</label>
    <progress id="progress-bar" value="0" max="100"></progress>
  </div>
  <div id="event-log"></div>
</body>
<script>
  const batchProgressEl = document.getElementById('batch-progress')
  const progressBarLabel = document.getElementById('progress-bar-label')
  const progressBar = document.getElementById('progress-bar')
  const eventLog = document.getElementById('event-log')
  function updateEventLog(events) {
    // remove children
    while (eventLog.firstChild) {
      eventLog.removeChild(eventLog.lastChild)
    }
    // add them back
    events.forEach((event) => {
      const newEl = document.createElement('p')
      newEl.textContent = event;
      newEl.id = 'event'
      eventLog.appendChild(newEl)
    })
  }
  function updateProgress(batchProgress) {
    const batchComplete = Number.parseInt(batchProgress.completedBatches ?? "0") 
    const totalBatches = Number.parseInt(batchProgress.totalBatches ?? "0")
    const totalItems = Number.parseInt(batchProgress.totalItems ?? "1")
    const completedItems = Number.parseInt(batchProgress.completedItems ?? "0")
    const failedItems = Number.parseInt(batchProgress.failedCount ?? "0")

    const percentComplete = Math.round(((completedItems + failedItems) / totalItems) * 100)
    batchProgressEl.innerText = `Batches Complete: ${batchComplete} of ${totalBatches}`
    progressBarLabel.innerText = `Percent Complete: ${percentComplete}%`
    progressBar.value = percentComplete;
  }
  function getProgress() {
    google.script.run.withSuccessHandler((progress) => {
      console.log(progress)
      updateEventLog(progress.scriptEvents)
      updateProgress(progress.batchProgress)
      if(progress.scriptFinished) {
        return
      } else {
        getProgress()
      }
    }).getScriptProgress()
  }

  getProgress()
</script>
</html>
